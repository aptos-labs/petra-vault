query CheckVaultDiscoveryProgress {
  latest_indexed_fee: multisig_creation_probe(
    order_by: { version: desc }
    limit: 1
  ) {
    version
  }
  target_without_owner_filter: multisig_creation_probe(
    where: { version: { _eq: "7350673760" } }
  ) {
    version
    owners
    total_charge_gas_units
  }
}
